[package]
name = "frms"
version = "0.1.2"
edition = "2021"

[[bin]]
name = "frms"
path = "src/main.rs"

[dependencies]
iced              = { version = "0.13", features = ["tokio", "canvas", "image", "advanced"] }
portable-pty      = "0.8"
vte               = "0.13"
tokio             = { version = "1", features = ["rt", "time", "sync", "process", "net", "io-util"] }
tokio-tungstenite = { version = "0.27", features = ["connect"] }
serde_json        = "1"
base64            = "0.22"
image             = { version = "0.24", default-features = false, features = ["jpeg", "png"] }
tokio-postgres    = "0.7"
mysql_async       = { version = "0.36", default-features = false }
ab_glyph          = "0.2"

# Build-time only: embed the Windows .ico into frms.exe (see build.rs). Kept
# unconditional (not host-gated) so it's available to build.rs when we
# cross-compile the Windows target from Linux; build.rs itself only invokes it
# for `CARGO_CFG_TARGET_OS == "windows"`.
[build-dependencies]
winresource = "0.1"
