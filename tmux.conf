# tmux.conf — terminal IDE configuration

# Prefix: Ctrl-a (easier than default Ctrl-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Mouse support
set -g mouse on

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Faster key repetition
set -s escape-time 0

# Increase scrollback
set -g history-limit 10000

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Status bar
set -g status-position bottom
set -g status-style "bg=colour235,fg=colour136"
set -g status-left "#[fg=colour166,bold] [#S] "
set -g status-left-length 20
set -g status-right "#[fg=colour136]%H:%M %d-%b-%Y "
set -g status-right-length 40
setw -g window-status-current-style "fg=colour166,bold"

# Pane borders
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour166"

# IDE shortcuts (registered dynamically by setup.sh)
# prefix b  — jump to file browser (left pane)
